name: Mirror Brave Browser Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Latest Brave Release Info
        id: brave_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Target repo: ${TARGET_REPO}"

          LATEST_TAG="$(gh release view --repo brave/brave-browser --json tagName --template '{{.tagName}}')"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"

          # Normalize: VERSION = tag without leading 'v'
          VERSION="${LATEST_TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if gh release view "$LATEST_TAG" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Mirror + Update Cask + Release
        if: env.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "New version found: ${LATEST_TAG} (version: ${VERSION})"

          rm -rf ./downloads
          mkdir -p ./downloads

          # Download only the architecture-specific macOS DMGs
          gh release download "${LATEST_TAG}" \
            --repo brave/brave-browser \
            --pattern "Brave-Browser-arm64.dmg" \
            --dir ./downloads

          gh release download "${LATEST_TAG}" \
            --repo brave/brave-browser \
            --pattern "Brave-Browser-x64.dmg" \
            --dir ./downloads

          # Safety checks
          test -f "./downloads/Brave-Browser-arm64.dmg"
          test -f "./downloads/Brave-Browser-x64.dmg"

          # Compute SHA256
          ARM_SHA="$(sha256sum ./downloads/Brave-Browser-arm64.dmg | awk '{print $1}')"
          INTEL_SHA="$(sha256sum ./downloads/Brave-Browser-x64.dmg | awk '{print $1}')"

          echo "ARM_SHA=$ARM_SHA"
          echo "INTEL_SHA=$INTEL_SHA"

          # Patch the cask file in-place
          CASK_FILE="Casks/courageux.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "ERROR: Expected cask at $CASK_FILE but file not found."
            echo "Adjust CASK_FILE in workflow to match your repo layout."
            exit 1
          fi

          # 1) Update version line
          sed -i.bak -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK_FILE"

          # 2) Update sha256 block (assumes same formatting you pasted)
          # Replace the arm sha line
          sed -i.bak -E "s/^  sha256 arm:   \"[a-f0-9]{64}\",/  sha256 arm:   \"${ARM_SHA}\",/" "$CASK_FILE"
          # Replace the intel sha line
          sed -i.bak -E "s/^         intel: \"[a-f0-9]{64}\"/         intel: \"${INTEL_SHA}\"/" "$CASK_FILE"

          # 3) Ensure URL points at v#{version} (not major_minor_patch)
          # Replace your current URL line (safe even if already correct)
          sed -i.bak -E 's|^  url "https://github.com/[^"]+/releases/download/[^"]+/Brave-Browser-#\{arch\}\.dmg"$|  url "https://github.com/chakujitsu/courage-tap/releases/download/v#{version}/Brave-Browser-#{arch}.dmg"|' "$CASK_FILE"

          rm -f "${CASK_FILE}.bak"

          # Commit the cask bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git commit -m "Update cask to Brave ${VERSION}" || echo "No cask changes to commit."
          git push

          # Create release in your repo using the SAME tag as upstream (vX.Y.Z)
          gh release create "${LATEST_TAG}" \
            ./downloads/Brave-Browser-arm64.dmg \
            ./downloads/Brave-Browser-x64.dmg \
            --repo "${TARGET_REPO}" \
            --title "Brave Browser ${VERSION}" \
            --notes "Automated mirror of Brave Browser macOS release ${LATEST_TAG}."

      - name: Cleanup Old Releases (Keep N-1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Cleaning up old releases, keeping only the 2 most recent..."
          RELEASES_TO_DELETE=$(gh release list --repo "${TARGET_REPO}" --limit 100 --json tagName --jq '.[2:] | .[].tagName')

          if [ -z "${RELEASES_TO_DELETE}" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --repo "${TARGET_REPO}" --yes --cleanup-tag || \
              echo "Skip: $TAG not found (already deleted?)"
          done <<< "${RELEASES_TO_DELETE}"
