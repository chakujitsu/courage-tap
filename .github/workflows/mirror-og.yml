name: Mirror Brave Browser Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch Latest Brave Release Info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Target repo: ${TARGET_REPO}"

          LATEST_TAG="$(gh release view --repo brave/brave-browser --json tagName --template '{{.tagName}}')"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"

          VERSION="${LATEST_TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # 1. Check if the Mac DMGs actually exist upstream yet
          echo "Checking if Mac assets exist upstream for ${LATEST_TAG}..."
          UPSTREAM_ASSETS="$(gh release view "${LATEST_TAG}" --repo brave/brave-browser --json assets --jq '.assets[].name')"
          
          if echo "$UPSTREAM_ASSETS" | grep -q "Brave-Browser-arm64.dmg" && echo "$UPSTREAM_ASSETS" | grep -q "Brave-Browser-x64.dmg"; then
            echo "MAC_ASSETS_READY=true" >> "$GITHUB_ENV"
            echo "Upstream Mac assets found."
          else
            echo "MAC_ASSETS_READY=false" >> "$GITHUB_ENV"
            echo "Upstream Mac assets are missing. Skipping this run until Brave uploads them."
          fi

          # 2. Check if we already mirrored this tag
          if gh release view "$LATEST_TAG" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Mirror Release (only if missing & upstream assets exist)
        if: env.EXISTS == 'false' && env.MAC_ASSETS_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "New tag not mirrored yet: ${LATEST_TAG}. Mirroring DMGs..."

          rm -rf ./downloads
          mkdir -p ./downloads

          gh release download "${LATEST_TAG}" \
            --repo brave/brave-browser \
            --pattern "Brave-Browser-arm64.dmg" \
            --dir ./downloads

          gh release download "${LATEST_TAG}" \
            --repo brave/brave-browser \
            --pattern "Brave-Browser-x64.dmg" \
            --dir ./downloads

          test -f "./downloads/Brave-Browser-arm64.dmg"
          test -f "./downloads/Brave-Browser-x64.dmg"

          gh release create "${LATEST_TAG}" \
            ./downloads/Brave-Browser-arm64.dmg \
            ./downloads/Brave-Browser-x64.dmg \
            --repo "${TARGET_REPO}" \
            --title "Brave Browser ${VERSION}" \
            --notes "Automated mirror of Brave Browser macOS release ${LATEST_TAG}."

      - name: Sync Cask to Upstream Latest (only if upstream assets exist)
        if: env.MAC_ASSETS_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          CASK_FILE: Casks/courageux.rb
        run: |
          set -euo pipefail

          test -f "${CASK_FILE}" || { echo "ERROR: Missing ${CASK_FILE}"; exit 1; }

          # Read current cask version
          CURRENT_VERSION="$(ruby -ne 'puts $1 if $_ =~ /^\s*version\s+"([^"]+)"/' "${CASK_FILE}" | head -n1 || true)"
          echo "Cask current version: ${CURRENT_VERSION:-<none>}"
          echo "Upstream version:      ${VERSION}"

          if [ "${CURRENT_VERSION}" = "${VERSION}" ]; then
            echo "Cask already matches latest. Skipping update."
            exit 0
          fi

          rm -rf ./downloads && mkdir -p ./downloads

          # Prefer DMGs from your mirror release if it exists; otherwise upstream
          if gh release view "${LATEST_TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "Downloading DMGs from MIRROR release ${LATEST_TAG}..."
            gh release download "${LATEST_TAG}" --repo "${TARGET_REPO}" --pattern "Brave-Browser-*.dmg" --dir ./downloads
          else
            echo "Mirror release missing; downloading DMGs from UPSTREAM ${LATEST_TAG}..."
            gh release download "${LATEST_TAG}" --repo brave/brave-browser --pattern "Brave-Browser-*.dmg" --dir ./downloads
          fi

          test -f "./downloads/Brave-Browser-arm64.dmg"
          test -f "./downloads/Brave-Browser-x64.dmg"

          ARM_SHA="$(sha256sum ./downloads/Brave-Browser-arm64.dmg | awk '{print $1}')"
          INTEL_SHA="$(sha256sum ./downloads/Brave-Browser-x64.dmg | awk '{print $1}')"

          echo "ARM_SHA=$ARM_SHA"
          echo "INTEL_SHA=$INTEL_SHA"

          export VERSION ARM_SHA INTEL_SHA CASK_FILE

          ruby <<'RUBY'
          cask_file = ENV.fetch("CASK_FILE")
          version   = ENV.fetch("VERSION")
          arm_sha   = ENV.fetch("ARM_SHA")
          intel_sha = ENV.fetch("INTEL_SHA")

          txt = File.read(cask_file)

          txt.sub!(/^(\s*version\s+")([^"]+)(")/, "\\1#{version}\\3") or
            abort("ERROR: version line not found / not updated")

          txt.sub!(/^(\s*sha256\s+arm:\s+")([a-f0-9]{64})(",)/i, "\\1#{arm_sha}\\3") or
            abort("ERROR: sha256 arm line not found / not updated")

          txt.sub!(/^(\s*intel:\s+")([a-f0-9]{64})(")/i, "\\1#{intel_sha}\\3") or
            abort("ERROR: sha256 intel line not found / not updated")

          File.write(cask_file, txt)
          puts "Updated #{cask_file} to version #{version}"
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${CASK_FILE}"

          if git diff --cached --quiet; then
            echo "ERROR: No staged changes; cask update failed."
            exit 1
          fi

          git commit -m "Update cask to Brave ${VERSION}"
          git push

      - name: Cleanup Old Releases (Keep 2 most recent)
        if: env.MAC_ASSETS_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Cleaning up old releases, keeping only the 2 most recent..."
          RELEASES_TO_DELETE=$(gh release list --repo "${TARGET_REPO}" --limit 100 --json tagName --jq '.[2:] | .[].tagName')

          if [ -z "${RELEASES_TO_DELETE}" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --repo "${TARGET_REPO}" --yes --cleanup-tag || \
              echo "Skip: $TAG not found (already deleted?)"
          done <<< "${RELEASES_TO_DELETE}"
